<svg xmlns="http://www.w3.org/2000/svg" width="820" height="820" viewBox="0 0 820 820" role="img" aria-label="Alaria logo sample">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b0f09"/>
      <stop offset="100%" stop-color="#100905"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d98d"/>
      <stop offset="50%" stop-color="#d6a95c"/>
      <stop offset="100%" stop-color="#a87535"/>
    </linearGradient>
    <linearGradient id="dragon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62b44f"/>
      <stop offset="100%" stop-color="#2f6b2f"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc55"/>
      <stop offset="55%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#ff4f0f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="820" height="820" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <circle cx="410" cy="290" r="200" fill="#2a2018" stroke="#8a6539" stroke-width="10"/>
    <path d="M270 390 C320 260, 510 230, 565 330 C515 325, 495 356, 472 405 C445 460, 352 470, 270 390 Z" fill="url(#dragon)" stroke="#244f22" stroke-width="8"/>
    <ellipse cx="452" cy="294" rx="22" ry="16" fill="#7ed064"/>
    <circle cx="460" cy="292" r="4" fill="#ff5336"/>
    <path d="M512 300 C600 292, 655 305, 722 330 C658 344, 606 358, 518 350 Z" fill="url(#flame)"/>
  </g>

  <g filter="url(#soft)">
    <rect x="95" y="455" width="630" height="180" rx="28" fill="#2a2016" stroke="#8f6a3d" stroke-width="10"/>
    <text x="410" y="555" text-anchor="middle" font-size="138" font-weight="900" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" letter-spacing="5">ALARIA</text>
    <text x="410" y="607" text-anchor="middle" font-size="44" font-weight="800" fill="#f2dec1" font-family="Verdana, Arial, sans-serif" letter-spacing="3">SMASH BYTE</text>
  </g>
</svg>
