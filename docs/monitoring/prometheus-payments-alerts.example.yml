# Example Prometheus alert rules for Confirmai payments/reconciliation.
#
# These rules use domain counters emitted by the app from payment audit/log events.
# If counters are not visible in your backend yet, use LogQL fallback rules in
# docs/monitoring/logql-payments-alerts.example.md until pipeline parsing/export is fixed.
#
# Expected counters:
# - confirmai_payment_reconciliation_panel_stale_total
# - confirmai_payment_failed_total
# - confirmai_payment_refunded_total
# - confirmai_webhook_warnings_total
# - confirmai_payment_reconciliation_pending_growth_events_total
#
# Operational counters (C32 Fase C, meter Confirmai.Ops):
# - confirmai_circuits_active
# - confirmai_circuits_reconnect_total
# - confirmai_email_send_failed_total
# - confirmai_proof_upload_rejected_total{reason}
# - confirmai_fee_settlements_pending_stale
#
# Keep this file as a template and adapt metric names to your telemetry backend.

groups:
  - name: confirmai-payments
    interval: 30s
    rules:
      - alert: ConfirmaiPaymentPanelStale
        expr: sum(increase(confirmai_payment_reconciliation_panel_stale_total[10m])) >= 1
        for: 2m
        labels:
          severity: p2
          team: payments
          component: reconciliation
        annotations:
          summary: "Painel de reconciliação defasado"
          description: "Foi detectado pelo menos 1 evento payment.reconciliation.panel.stale na janela de 10 minutos."
          runbook: "docs/observability-payments-runbook.md"

      - alert: ConfirmaiPaymentFailedSpike
        expr: sum(increase(confirmai_payment_failed_total[15m])) > 5
        for: 5m
        labels:
          severity: p1
          team: payments
          component: gateway
        annotations:
          summary: "Pico de falhas de pagamento"
          description: "payment.failed excedeu 5 eventos em 15 minutos."
          runbook: "docs/observability-payments-runbook.md"

      - alert: ConfirmaiPaymentRefundedSpike
        expr: sum(increase(confirmai_payment_refunded_total[30m])) > 3
        for: 5m
        labels:
          severity: p1
          team: payments
          component: refund
        annotations:
          summary: "Pico de reembolsos"
          description: "payment.refunded excedeu 3 eventos em 30 minutos."
          runbook: "docs/observability-payments-runbook.md"

      - alert: ConfirmaiWebhookWarningSpike
        expr: sum(increase(confirmai_webhook_warnings_total[15m])) > 10
        for: 3m
        labels:
          severity: p1
          team: payments
          component: webhook
        annotations:
          summary: "Pico de warnings em webhook"
          description: "Warnings de Webhook excederam 10 eventos em 15 minutos."
          runbook: "docs/observability-payments-runbook.md"

      - alert: ConfirmaiReconciliationPendingGrowing
        expr: sum(increase(confirmai_payment_reconciliation_pending_growth_events_total[30m])) >= 3
        for: 5m
        labels:
          severity: p2
          team: payments
          component: reconciliation
        annotations:
          summary: "Pendências em reconciliação estão crescendo"
          description: "A reconciliação registrou crescimento de pending em 3 ou mais varreduras nos últimos 30 minutos."
          runbook: "docs/observability-payments-runbook.md"

  - name: confirmai-ops
    interval: 30s
    rules:
      - alert: ConfirmaiEmailSendFailedSpike
        expr: sum(increase(confirmai_email_send_failed_total[15m])) > 3
        for: 5m
        labels:
          severity: p1
          team: ops
          component: email
        annotations:
          summary: "Falhas de envio de email SMTP"
          description: "Mais de 3 falhas de envio de email em 15 minutos — cadastro/reset travados (RequireConfirmedEmail)."

      - alert: ConfirmaiProofUploadRejectedSpike
        expr: sum(increase(confirmai_proof_upload_rejected_total[15m])) > 20
        for: 5m
        labels:
          severity: p2
          team: ops
          component: proof-upload
        annotations:
          summary: "Pico de comprovantes rejeitados"
          description: "Mais de 20 uploads de comprovante rejeitados em 15 minutos — verificar a tag reason (mime, signature, size, ownership)."

      - alert: ConfirmaiFeeSettlementStale
        expr: confirmai_fee_settlements_pending_stale > 0
        for: 30m
        labels:
          severity: p2
          team: payments
          component: settlement
        annotations:
          summary: "Repasse de taxa parado em análise"
          description: "Existe lote de repasse EmAnalise há mais de Ops:StaleSettlementDays dias (default 3)."

      - alert: ConfirmaiCircuitReconnectSpike
        expr: sum(increase(confirmai_circuits_reconnect_total[10m])) > 30
        for: 5m
        labels:
          severity: p3
          team: ops
          component: blazor
        annotations:
          summary: "Reconexões de circuito Blazor em massa"
          description: "Mais de 30 reconexões de circuito em 10 minutos — rede ou instância instável."
