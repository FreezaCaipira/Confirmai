# ops/nginx/confirmai.conf
# Reverse proxy para o Confirmai — HTTPS + mTLS opcional (webhooks EfiBank Pix)
#
# Instalação:
#   sudo cp ops/nginx/confirmai.conf /etc/nginx/sites-available/confirmai
#   # Substitua "confirmai.suaempresa.com" pelo seu domínio real no arquivo copiado
#   sudo ln -s /etc/nginx/sites-available/confirmai /etc/nginx/sites-enabled/confirmai
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pré-requisito (mTLS EfiBank com validação de CA — mais seguro):
#   sudo mkdir -p /etc/nginx/certs
#   sudo curl -o /etc/nginx/certs/efipay-ca.crt \
#        https://certificados.efipay.com.br/efipay.crt
#   # Então troque ssl_verify_client para "optional" e descomente ssl_client_certificate.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name confirmai.suaempresa.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS + mTLS ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name confirmai.suaempresa.com;

    # ── TLS do servidor (Let's Encrypt — gerado por certbot) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/confirmai.suaempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/confirmai.suaempresa.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── mTLS: certificado cliente para webhooks EfiBank Pix ──────────────────
    # "optional_no_ca": solicita cert cliente mas não valida a cadeia CA.
    # O app (EfiBankWebhookService) verifica o Subject do cert via o header abaixo.
    #
    # Para validação completa com o CA da Efí (recomendado em produção):
    #   ssl_verify_client    optional;
    #   ssl_client_certificate /etc/nginx/certs/efipay-ca.crt;
    ssl_verify_client optional_no_ca;

    # Repassa o certificado cliente (PEM URL-encoded) ao backend.
    # Lido por EfiBankWebhookService.TryGetCertFromHeader().
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;

    # ── Cabeçalhos de proxy padrão ────────────────────────────────────────────
    proxy_http_version 1.1;

    # SignalR / WebSocket (Blazor Server requer)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads de evidências e fotos de perfil
    client_max_body_size 10M;

    # Timeout longo necessário para SignalR (circuit mantido por minutos)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
